name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Publication gate (fail-closed)
        run: npm run check:publish
      - name: Build content pipeline
        run: npm run build
      - name: HTML validation
        run: npm run check:html
      - name: Local link check
        run: npm run check:links
