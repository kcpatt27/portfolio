name: smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *' # daily, 13:00 UTC

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Live smoke check
        run: node scripts/smoke.mjs
